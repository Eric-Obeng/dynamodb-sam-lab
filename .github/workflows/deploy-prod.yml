name: Deploy (prod)

# Deploys ONLY the prod stack, through the prod-specific pipeline role and
# artifacts bucket created by `sam pipeline bootstrap --stage prod`.
# Stack name, region and parameters come from [prod.*] in samconfig.toml.
on:
  push:
    branches: [main]
    paths:
      - "template.yaml"
      - "samconfig.toml"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch:

# Only one prod deployment at a time; queue rather than cancel so a
# CloudFormation update is never interrupted mid-flight.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Least privilege by default; only the deploy job may request an OIDC token.
permissions:
  contents: read

env:
  SAM_CONFIG_ENV: prod
  SAM_CLI_TELEMETRY: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: Validate and lint template
        run: sam validate --config-env "$SAM_CONFIG_ENV"

  # Runs in the GitHub `prod` environment, which only accepts deployments
  # from `main` and holds this environment's variables (no other
  # environment's values are visible here). It also requires a
  # reviewer's approval before the job starts.
  # The OIDC sub claim becomes "repo:<owner>/<repo>:environment:prod", which is
  # what the prod pipeline execution role trusts.
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PIPELINE_EXECUTION_ROLE }}
          role-session-name: prod-deployment-${{ github.run_id }}
          aws-region: ${{ vars.REGION }}

      - name: Build
        run: sam build --config-env "$SAM_CONFIG_ENV"

      - name: Deploy
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          CLOUDFORMATION_EXECUTION_ROLE: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE }}
        run: |
          sam deploy \
            --config-env "$SAM_CONFIG_ENV" \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --role-arn "$CLOUDFORMATION_EXECUTION_ROLE" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Show stack outputs
        run: sam list stack-outputs --config-env "$SAM_CONFIG_ENV" --output table
