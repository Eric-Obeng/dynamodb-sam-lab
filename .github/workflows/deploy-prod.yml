name: Deploy (prod)

# Deploys ONLY the prod stack, through the prod-specific pipeline role and
# artifacts bucket created by `sam pipeline bootstrap --stage prod`.
# Stack name, region and parameters come from [prod.*] in samconfig.toml.
on:
  push:
    branches: [main]
    paths:
      - "template.yaml"
      - "samconfig.toml"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch:

# Only one prod deployment at a time; queue rather than cancel so a
# CloudFormation update is never interrupted mid-flight.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Least privilege by default; only the deploy job may request an OIDC token.
permissions:
  contents: read

env:
  SAM_CONFIG_ENV: prod
  SAM_CLI_TELEMETRY: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - name: Validate and lint template
        run: sam validate --config-env "$SAM_CONFIG_ENV"

  # NOTE: no `environment:` key on this job on purpose - setting one changes
  # the OIDC sub claim to "repo:<org>/<repo>:environment:<name>", which would
  # no longer match the branch-scoped trust policy sam pipeline bootstrap
  # creates ("repo:<org>/<repo>:ref:refs/heads/main").
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.PROD_PIPELINE_EXECUTION_ROLE }}
          role-session-name: prod-deployment-${{ github.run_id }}
          aws-region: ${{ vars.PROD_REGION }}

      - name: Build
        run: sam build --config-env "$SAM_CONFIG_ENV"

      - name: Deploy
        env:
          ARTIFACTS_BUCKET: ${{ vars.PROD_ARTIFACTS_BUCKET }}
          CLOUDFORMATION_EXECUTION_ROLE: ${{ vars.PROD_CLOUDFORMATION_EXECUTION_ROLE }}
        run: |
          sam deploy \
            --config-env "$SAM_CONFIG_ENV" \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --role-arn "$CLOUDFORMATION_EXECUTION_ROLE" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Show stack outputs
        run: sam list stack-outputs --config-env "$SAM_CONFIG_ENV" --output table
