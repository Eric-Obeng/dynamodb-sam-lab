name: Deploy (dev)

# Deploys ONLY the dev stack, through the dev-specific pipeline role and
# artifacts bucket created by `sam pipeline bootstrap --stage dev`.
# Stack name, region and parameters come from [dev.*] in samconfig.toml.
on:
  push:
    branches: [develop]
    paths:
      - "template.yaml"
      - "samconfig.toml"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

# Only one dev deployment at a time; queue rather than cancel so a
# CloudFormation update is never interrupted mid-flight.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

# Least privilege by default; only the deploy job may request an OIDC token.
permissions:
  contents: read

env:
  SAM_CONFIG_ENV: dev
  SAM_CLI_TELEMETRY: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - name: Validate and lint template
        run: sam validate --config-env "$SAM_CONFIG_ENV"

  # Runs in the GitHub `dev` environment, which only accepts deployments
  # from `develop` and holds this environment's variables (no other
  # environment's values are visible here).
  # The OIDC sub claim becomes "repo:<owner>/<repo>:environment:dev", which is
  # what the dev pipeline execution role trusts.
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PIPELINE_EXECUTION_ROLE }}
          role-session-name: dev-deployment-${{ github.run_id }}
          aws-region: ${{ vars.REGION }}

      - name: Build
        run: sam build --config-env "$SAM_CONFIG_ENV"

      - name: Deploy
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          CLOUDFORMATION_EXECUTION_ROLE: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE }}
        run: |
          sam deploy \
            --config-env "$SAM_CONFIG_ENV" \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --role-arn "$CLOUDFORMATION_EXECUTION_ROLE" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Show stack outputs
        run: sam list stack-outputs --config-env "$SAM_CONFIG_ENV" --output table
