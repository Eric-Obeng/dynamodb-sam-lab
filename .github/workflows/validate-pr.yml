name: Validate (PR)

# Runs on every pull request so template problems are caught before merge,
# not after a deploy has started. Needs no AWS access. The job name
# "validate-pr" is the status check required by branch protection on main.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  SAM_CLI_TELEMETRY: "0"

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - name: Validate and lint template (dev config)
        run: sam validate --config-env dev

      - name: Validate and lint template (prod config)
        run: sam validate --config-env prod

      - name: Build (dev config)
        run: sam build --config-env dev

      - name: Lint pipeline role template
        run: pipx run cfn-lint pipeline/cfn-execution-role.yaml
